[package]
name = "nervemq-example"
version = "0.1.0"
edition = "2021"
# `cargo run` runs the example; the benchmark is `cargo run --bin benchmark`.
default-run = "nervemq-example"

[dependencies]
aws-config = "1.5.10"
aws-sdk-sqs = "1.50.0"
eyre = "0.6.12"
tokio = { version = "1.42.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
